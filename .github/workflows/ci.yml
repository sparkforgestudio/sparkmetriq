name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # Spécifiez la version Python désirée (par exemple, '3.8')

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Mise à jour de pip
          pip install -r requirements.txt  # Installation des dépendances listées dans requirements.txt

      - name: Lint with flake8
        run: |
          flake8 .  # Exécute flake8 sur tous les fichiers du projet

      - name: Run tests with pytest
        run: |
          pytest  # Exécute les tests avec pytest
